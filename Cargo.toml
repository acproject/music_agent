[workspace]
resolver = "2"
members = [
    "crates/config",
    "crates/domain",
    "crates/audio",
    "crates/storage",
    "crates/analysis-client",
    "crates/agent",
    "crates/tools",
    "crates/api",
]

[workspace.package]
version = "0.1.0-m0"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"

[workspace.dependencies]
# ---- 内部 crate ----
music-config = { path = "crates/config" }
music-domain = { path = "crates/domain" }
music-audio = { path = "crates/audio" }
music-storage = { path = "crates/storage" }
music-analysis-client = { path = "crates/analysis-client" }
music-agent = { path = "crates/agent" }
music-tools = { path = "crates/tools" }

# ---- 异步 / Web ----
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"

# ---- gRPC / 序列化 ----
tonic = "0.13"
tonic-build = "0.13"
prost = "0.13"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ---- 存储 ----
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }

# ---- LLM HTTP ----
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# ---- 观测 / 错误 / 配置 ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
async-trait = "0.1"
dotenvy = "0.15"

[profile.release]
opt-level = 2
